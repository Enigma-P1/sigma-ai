[package]
name = "desktop"
version = "0.2.0"
description = "Sigma AI packaging spike: Tauri shell + packaged Python statistics sidecar"
authors = ["Sigma AI"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Spawns and manages the sigma-engine sidecar (see src/lib.rs). Only the Rust
# side calls into this plugin -- the frontend just does plain `fetch()` to the
# sidecar's HTTP API -- so no shell capability grant is needed in
# capabilities/default.json: Tauri's permission/ACL system gates calls made
# from the webview, not direct Rust calls (confirmed against
# https://tauri.app/develop/sidecar/, "Running it from Rust" vs "...from
# JavaScript").
tauri-plugin-shell = "2"

