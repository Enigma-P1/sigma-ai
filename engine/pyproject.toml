[project]
name = "sigma-engine"
version = "0.1.0"
description = "Sigma AI packaging-spike Python sidecar: FastAPI health/smoke endpoints, NIST-verified statistics."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "scipy==1.17.1",
    "pydantic==2.13.4",
    "reportlab==4.4.4",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "pyinstaller==6.21.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sigma_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
