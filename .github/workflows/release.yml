name: release

# Publishes a clean download page. Pushing a version tag (e.g. v0.1.0)
# builds the same Windows .msi/.nsis and Mac .dmg the `build` workflow
# already proves green on every push to main, then attaches them to a
# GitHub Release -- so a non-technical user downloads the installer from
# one page instead of digging through Actions artifacts (which also
# require a login and expire; Release assets do neither).
#
# The build jobs below are copied faithfully from .github/workflows/
# build.yml (kept a separate, tag-only workflow so it can never disturb
# the proven main-branch build). If build.yml's installer steps change,
# mirror the change here.

on:
  push:
    tags:
      - "v*"
  # Manual trigger: publishes a release without a local `git tag` push
  # (the session that authored this couldn't push tag refs -- its git
  # credential is scoped to branch pushes). The publish job below creates
  # the tag itself via `gh release create --target`.
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create and publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  test:
    name: Engine tests (pytest) — release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: engine/pyproject.toml
      - name: Install engine (+ dev deps)
        working-directory: engine
        run: pip install -e ".[dev]"
      # A tag is only ever cut from an already-green main commit; this is a
      # fast belt-and-suspenders gate so a broken tag can't ship an installer.
      - name: Run pytest
        working-directory: engine
        run: pytest -q

  build-windows:
    name: Build Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: engine/pyproject.toml

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@v2.9.2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install engine (+ PyInstaller)
        working-directory: engine
        run: pip install -e ".[dev]"

      - name: Build sidecar and place it for Tauri's externalBin
        shell: bash
        run: scripts/build-sidecar.sh

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: tauri build
        working-directory: desktop
        run: npm run tauri build

      - name: Smoke-test the staged sidecar
        shell: bash
        working-directory: desktop/src-tauri/target/release
        run: |
          set -euo pipefail
          ./sigma-engine.exe --port 8756 &
          SIDECAR_PID=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8756/health > /dev/null 2>&1 && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8756/health
          echo
          curl -sf http://127.0.0.1:8756/smoke -o smoke.json
          cat smoke.json
          python3 -c "import json; d = json.load(open('smoke.json')); assert d['match'] is True, d"
          kill "$SIDECAR_PID"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sigma-ai-windows-installers
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-mac:
    name: Build Mac installer
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: engine/pyproject.toml

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@v2.9.2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install engine (+ PyInstaller)
        working-directory: engine
        run: pip install -e ".[dev]"

      - name: Build sidecar and place it for Tauri's externalBin
        run: scripts/build-sidecar.sh

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: tauri build (app bundle only)
        working-directory: desktop
        run: npm run tauri build -- --bundles app

      # See build.yml for why the onedir sidecar's _internal must be merged
      # into Contents/Frameworks inside a macOS .app (PYI-9202).
      - name: Fix up onedir sidecar layout in the .app bundle
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(desktop/src-tauri/target/release/bundle/macos/*.app)
          if [ ${#apps[@]} -ne 1 ]; then
            echo "ERROR: expected exactly one .app bundle, found: ${apps[*]}" >&2
            exit 1
          fi
          APP_PATH="${apps[0]}"
          echo "App bundle: $APP_PATH"

          INTERNAL_SRC="$APP_PATH/Contents/Resources/_internal"
          FRAMEWORKS_DST="$APP_PATH/Contents/Frameworks"
          if [ ! -d "$INTERNAL_SRC" ]; then
            echo "ERROR: $INTERNAL_SRC not found -- tauri.conf.json's bundle.resources mapping may have changed." >&2
            exit 1
          fi
          mkdir -p "$FRAMEWORKS_DST"
          ditto "$INTERNAL_SRC" "$FRAMEWORKS_DST"
          rm -rf "$INTERNAL_SRC"
          ls "$FRAMEWORKS_DST" | head -5
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Smoke-test the sidecar inside the fixed .app
        run: |
          set -euo pipefail
          "$APP_PATH/Contents/MacOS/sigma-engine" --port 8756 &
          SIDECAR_PID=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8756/health > /dev/null 2>&1 && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8756/health
          echo
          curl -sf http://127.0.0.1:8756/smoke -o smoke.json
          cat smoke.json
          python3 -c "import json; d = json.load(open('smoke.json')); assert d['match'] is True, d"
          kill "$SIDECAR_PID"

      - name: Build dmg from the fixed .app
        run: |
          set -euo pipefail
          mkdir -p dist-dmg
          hdiutil create -volname "Sigma AI" -srcfolder "$APP_PATH" -ov -format UDZO \
            "dist-dmg/Sigma AI_0.1.0_$(uname -m).dmg"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sigma-ai-mac-installer
          path: dist-dmg/*.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the Release and attach assets
      actions: read # `gh run download` below needs this to fetch this run's artifacts
    steps:
      # Fetch this run's own already-built installers with the runner's
      # built-in gh CLI, rather than actions/download-artifact -- that
      # action is versioned separately from upload-artifact and a wrong
      # pin (v7.0.1 doesn't exist for it) failed release run #1; gh has no
      # version to get wrong. The build jobs this one `needs:` have already
      # uploaded their artifacts by the time this step runs.
      - name: Download built installers from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --dir release-assets --repo "$GITHUB_REPOSITORY"

      - name: Publish the Release with the installers attached
        env:
          GH_TOKEN: ${{ github.token }}
          # Tag name from whichever trigger fired: the pushed tag, or the
          # manual-dispatch input. TARGET_SHA anchors a dispatch-created tag
          # to the commit the workflow ran on (ignored when the tag already
          # exists from a tag push).
          TAG: ${{ inputs.version || github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Collect every installer the build jobs produced.
          mapfile -t ASSETS < <(find release-assets -type f \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \) | sort)
          echo "Installers to attach:"
          printf '  %s\n' "${ASSETS[@]}"
          if [ "${#ASSETS[@]}" -lt 2 ]; then
            echo "ERROR: expected at least a Windows and a Mac installer, found ${#ASSETS[@]}" >&2
            exit 1
          fi

          cat > release-notes.md <<'NOTES'
          **Sigma AI — a guided Lean Six Sigma Green Belt suite you run on your own machine.**

          All the tools, math, and charts run entirely on your computer and send
          nothing anywhere. An optional AI advisor (bring your own Anthropic key)
          is the only part that talks to the internet, and only when you use it.

          ### Download

          - **Windows:** the `.msi` (standard installer). If your machine blocks
            `.msi` files, use the `.exe` (NSIS setup) instead — same app.
          - **Mac:** the `.dmg` (Apple Silicon). Open it and drag Sigma AI to
            Applications.

          ### Heads-up: the app is not code-signed

          This is a personal build with no paid signing certificate, so on first
          launch each OS warns you:

          - **Windows** shows a blue *"Windows protected your PC"* SmartScreen
            box. Click **More info → Run anyway**.
          - **Mac** says the app is from an unidentified developer. **Right-click
            the app → Open**, then confirm.

          Both warnings are the OS reacting to the missing signature, not to
          anything detected in the app. Full walkthroughs with screenshots:
          [Windows](docs/install-windows.md) · [Mac](docs/install-mac.md).

          Everything in this suite is externally AI-reviewed; no claim here is a
          human certification.
          NOTES

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists -- updating its assets."
            gh release upload "$TAG" "${ASSETS[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            # --target creates the tag at this commit when it doesn't exist
            # yet (the manual-dispatch path); harmless when the tag push
            # already created it.
            gh release create "$TAG" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "Sigma AI $TAG" \
              --notes-file release-notes.md
          fi
