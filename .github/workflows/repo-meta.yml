name: repo-meta

# Sets the repository's About description and topics. Exists because repo
# metadata can only be set through the GitHub API, and sessions hold
# branch-push credentials only. Runs on the cheap Linux tier in seconds.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repo-meta.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - name: Set description and topics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh repo edit "$GITHUB_REPOSITORY" \
            --description "Guided Lean Six Sigma (DMAIC) desktop app — real statistics, honest charts, and a one-page summary a supervisor can hand a manager. Runs entirely on your machine. Windows & Mac." \
            --add-topic six-sigma \
            --add-topic lean-six-sigma \
            --add-topic dmaic \
            --add-topic continuous-improvement \
            --add-topic quality-management \
            --add-topic pareto-chart \
            --add-topic spc \
            --add-topic statistics \
            --add-topic desktop-app \
            --add-topic local-first \
            --add-topic tauri \
            --add-topic python
