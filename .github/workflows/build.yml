name: build

# M1 packaging spike (PLAN.md §8 milestone 1): prove the Tauri +
# PyInstaller-sidecar pipeline produces a working installer on Windows and
# Mac. This container can't cross-compile either target -- CI is the only
# place that can actually build or prove them (see docs/m1-spike-notes.md
# for exactly what was verified locally vs what only CI can prove).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  test:
    name: Engine tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: engine/pyproject.toml

      - name: Install engine (+ dev deps)
        working-directory: engine
        run: pip install -e ".[dev]"

      - name: Run pytest
        working-directory: engine
        run: pytest -v

  build-windows:
    name: Build Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: engine/pyproject.toml

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@v2.9.2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install engine (+ PyInstaller)
        working-directory: engine
        run: pip install -e ".[dev]"

      - name: Build sidecar and place it for Tauri's externalBin
        shell: bash
        run: scripts/build-sidecar.sh

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: tauri build
        working-directory: desktop
        run: npm run tauri build

      # Sanity-check the sidecar Tauri actually staged, independent of the
      # msi/nsis packaging step: `tauri build` always copies the resolved
      # externalBin (renamed, no target-triple suffix) plus its `resources`
      # into src-tauri/target/release/ before any installer-specific
      # bundling happens, and that directory has no bin/lib-style split -- so
      # this checks the sidecar+_internal pairing on real Windows before
      # trusting the installer built from them.
      - name: Smoke-test the staged sidecar
        shell: bash
        working-directory: desktop/src-tauri/target/release
        run: |
          set -euo pipefail
          ./sigma-engine.exe --port 8756 &
          SIDECAR_PID=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8756/health > /dev/null 2>&1 && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8756/health
          echo
          curl -sf http://127.0.0.1:8756/smoke -o smoke.json
          cat smoke.json
          python3 -c "import json; d = json.load(open('smoke.json')); assert d['match'] is True, d"
          kill "$SIDECAR_PID"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sigma-ai-windows-installers
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-mac:
    name: Build Mac installer
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: engine/pyproject.toml

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@v2.9.2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install engine (+ PyInstaller)
        working-directory: engine
        run: pip install -e ".[dev]"

      - name: Build sidecar and place it for Tauri's externalBin
        run: scripts/build-sidecar.sh

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      # app only, not dmg -- the .app has to be fixed (next step) before
      # it's wrapped into a dmg, and once wrapped a dmg is a sealed disk
      # image, not something to patch after the fact.
      - name: tauri build (app bundle only)
        working-directory: desktop
        run: npm run tauri build -- --bundles app

      # KNOWN, PROVEN-IN-CI-CONTAINER ISSUE (not just theoretical -- see
      # docs/m1-spike-notes.md for the reproduction on an equivalent Linux
      # .deb build): PyInstaller's onedir bootloader looks for its
      # `_internal` support directory as a literal filesystem sibling of the
      # running executable. Tauri's `externalBin` sidecar and `bundle.resources`
      # are placed in DIFFERENT directories inside a macOS .app --
      # Contents/MacOS (sidecar) vs Contents/Resources (resources), per
      # Tauri's own documented resourceDir() behavior -- so the sidecar
      # cannot find `_internal` unless something moves it. This step is that
      # fix, applied to the real .app before it's sealed into a dmg.
      - name: Fix up onedir sidecar layout in the .app bundle
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(desktop/src-tauri/target/release/bundle/macos/*.app)
          if [ ${#apps[@]} -ne 1 ]; then
            echo "ERROR: expected exactly one .app bundle, found: ${apps[*]}" >&2
            exit 1
          fi
          APP_PATH="${apps[0]}"
          echo "App bundle: $APP_PATH"

          INTERNAL_SRC="$APP_PATH/Contents/Resources/_internal"
          INTERNAL_DST="$APP_PATH/Contents/MacOS/_internal"
          if [ ! -d "$INTERNAL_SRC" ]; then
            echo "ERROR: $INTERNAL_SRC not found -- tauri.conf.json's bundle.resources mapping may have changed." >&2
            exit 1
          fi
          mv "$INTERNAL_SRC" "$INTERNAL_DST"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      # Proves the fix actually worked, on real macOS, before we bother
      # sealing a dmg around it -- the sidecar is a plain CLI binary, so it
      # can be smoke-tested directly without launching the GUI app.
      - name: Smoke-test the sidecar inside the fixed .app
        run: |
          set -euo pipefail
          "$APP_PATH/Contents/MacOS/sigma-engine" --port 8756 &
          SIDECAR_PID=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8756/health > /dev/null 2>&1 && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8756/health
          echo
          curl -sf http://127.0.0.1:8756/smoke -o smoke.json
          cat smoke.json
          python3 -c "import json; d = json.load(open('smoke.json')); assert d['match'] is True, d"
          kill "$SIDECAR_PID"

      - name: Build dmg from the fixed .app
        run: |
          set -euo pipefail
          mkdir -p dist-dmg
          hdiutil create -volname "Sigma AI" -srcfolder "$APP_PATH" -ov -format UDZO \
            "dist-dmg/Sigma AI_0.1.0_$(uname -m).dmg"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sigma-ai-mac-installer
          path: dist-dmg/*.dmg
          if-no-files-found: error
