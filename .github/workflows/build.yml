name: build

# M1 packaging spike (PLAN.md §8 milestone 1): prove the Tauri +
# PyInstaller-sidecar pipeline produces a working installer on Windows and
# Mac. This container can't cross-compile either target -- CI is the only
# place that can actually build or prove them (see docs/m1-spike-notes.md
# for exactly what was verified locally vs what only CI can prove).

on:
  push:
    branches: [main]
    # Prose-only paths. Every push to main here spins a Windows AND a macOS
    # runner, and those bill at 2x and 10x the Linux minute rate -- so a
    # typo fix in a README costs about what a real code change costs. A
    # commit touching nothing but the paths below cannot change what any job
    # in this file builds or asserts, so it should not buy a pair of
    # installer builds.
    #
    # DELIBERATELY NOT IGNORED, though they are .md -- these are read at
    # test time, so editing them can genuinely fail this workflow:
    #   docs/traceability-matrix.md  parsed by evals/harness/run_goldens.py
    #                                and engine/tests/test_eval_harness.py;
    #                                golden_id_map fails the job when the
    #                                G-ids it cites drift from the goldens
    #   docs/green-belt-rubric.md    read by engine/tests/test_advisor_rubric_items.py
    #   docs/tier-a-done-means.md    authority doc; held to the full gate by
    #                                choice even though only comments cite it
    #   examples/**                  was ignored until the UI probes below
    #                                started unzipping
    #                                coffee-bar-example-project.zip and
    #                                rendering it; the example is now a test
    #                                INPUT, so a change to it must re-run
    #                                this workflow
    # (evals/scenarios/*/spec.md and prompts/**/*.md are also read at test
    # time and are not under any ignored path -- keep it that way.)
    #
    # Rule for adding to this list: only if nothing under engine/, evals/,
    # or desktop/ opens the file at run time. When unsure, leave it out. An
    # unnecessary build is the cheap mistake; a skipped build that should
    # have run is the expensive one.
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "PLAN.md"
      - "docs/architecture.md"
      - "docs/belt-reviewer-brief.md"
      - "docs/demo-walkthrough.md"
      - "docs/field-notes.md"
      - "docs/install-mac.md"
      - "docs/install-windows.md"
      - "docs/local-app-testing.md"
      - "docs/m1-spike-notes.md"
      - "docs/open-questions.md"
      - "docs/research-summary.md"
      - "docs/test-drive.md"
      - "docs/research/**"
      - "docs/screenshots/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  test:
    name: Engine tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: engine/pyproject.toml

      - name: Install engine (+ dev deps)
        working-directory: engine
        run: pip install -e ".[dev]"

      - name: Run pytest
        working-directory: engine
        run: pytest -v

      # M6 golden-scenario eval harness (PLAN §9): a scripted walkthrough
      # drives the Coffee Bar demo + the two held-out scenarios through
      # every Tier-A tool in their declared scope and diffs the result
      # against evals/goldens/. Runs OUTSIDE the engine package (plain
      # python + httpx, engine/.venv already has httpx from the dev
      # extras installed above) against a real ephemeral engine instance,
      # never mocked -- a real regression in the stats/schema layer is
      # exactly what this step exists to catch before it ships. Freezing
      # goldens is a local/PR-author action (see evals/README.md); CI only
      # ever replays and fails on drift.
      # CI installs the engine into the job's own Python (pip install -e
      # ".[dev]" above) -- there is no .venv on the runner; that path is a
      # local-development convenience only. Run 31 failed exactly there.
      - name: Start engine (ephemeral, for the golden-scenario harness)
        working-directory: engine
        run: |
          set -euo pipefail
          python -m uvicorn sigma_engine.main:app --port 8000 > /tmp/eval-harness-engine.log 2>&1 &
          echo $! > /tmp/eval-harness-engine.pid
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1 && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8000/health
          echo

      - name: Run golden-scenario harness (replay, fails the job on diff)
        env:
          SIGMA_PROJECTS_ROOT: ${{ runner.temp }}/sigma-ai-eval-projects
        run: python evals/harness/run_goldens.py

      # Reproduces the PACKAGED-app condition on a plain Linux runner: a real
      # browser on one origin calling the engine on another, so the browser
      # enforces CORS exactly as the Tauri webview does. Two bugs reached a
      # real user because nothing tested this -- the Vite smoke proxies
      # same-origin (never preflights) and curl doesn't preflight at all.
      # Cheap and platform-independent, so it runs here rather than costing
      # a Windows/Mac installer build to discover.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install frontend deps (for Playwright)
        working-directory: desktop
        run: npm ci

      - name: Install Playwright's chromium
        working-directory: desktop
        run: npx playwright install --with-deps chromium

      - name: Cross-origin probe (packaged-webview condition)
        working-directory: desktop
        env:
          ENGINE_PORT: "8000" # the ephemeral engine started above
        run: node tools/xorigin-probe.mjs

      # The two checks that need a real rendered UI, not just a live route.
      # Both cover failures that are invisible at the API layer: the example
      # zip rendering blank in every form (right ids, wrong names), and the
      # export button producing no file (a webview cancels downloads with no
      # error unless the window carries a download handler).
      - name: Build the production bundle (for the UI probes)
        working-directory: desktop
        run: npm run build

      - name: Stage the worked example for the UI probes
        run: |
          mkdir -p /tmp/probe-projects
          cd /tmp/probe-projects
          unzip -qo "$GITHUB_WORKSPACE/examples/coffee-bar-example-project.zip"
          test -f /tmp/probe-projects/coffee-bar-example/project.json

      - name: Start engine over the worked example
        run: |
          cd engine
          SIGMA_PROJECTS_ROOT=/tmp/probe-projects \
            python -m sigma_engine.main --port 8756 > /tmp/probe-engine.log 2>&1 &
          echo $! > /tmp/probe-engine.pid
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8756/health >/dev/null && exit 0
            sleep 1
          done
          echo "engine did not come up"; cat /tmp/probe-engine.log; exit 1

      - name: Example project renders (every tool populated)
        working-directory: desktop
        run: node tools/example-project-probe.mjs

      - name: Export project produces a real PDF on disk
        working-directory: desktop
        run: node tools/export-project-probe.mjs

      - name: Stop probe engine
        if: always()
        run: |
          if [ -f /tmp/probe-engine.pid ]; then
            kill "$(cat /tmp/probe-engine.pid)" 2>/dev/null || true
          fi

      - name: Stop engine
        if: always()
        run: |
          if [ -f /tmp/eval-harness-engine.pid ]; then
            kill "$(cat /tmp/eval-harness-engine.pid)" 2>/dev/null || true
          fi

      - name: Upload engine log (on failure)
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: eval-harness-engine-log
          path: /tmp/eval-harness-engine.log
          if-no-files-found: ignore

  build-windows:
    name: Build Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: engine/pyproject.toml

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@v2.9.2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install engine (+ PyInstaller)
        working-directory: engine
        run: pip install -e ".[dev]"

      - name: Build sidecar and place it for Tauri's externalBin
        shell: bash
        run: scripts/build-sidecar.sh

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: tauri build
        working-directory: desktop
        run: npm run tauri build

      # Sanity-check the sidecar Tauri actually staged, independent of the
      # msi/nsis packaging step: `tauri build` always copies the resolved
      # externalBin (renamed, no target-triple suffix) plus its `resources`
      # into src-tauri/target/release/ before any installer-specific
      # bundling happens, and that directory has no bin/lib-style split -- so
      # this checks the sidecar+_internal pairing on real Windows before
      # trusting the installer built from them.
      - name: Smoke-test the staged sidecar
        shell: bash
        working-directory: desktop/src-tauri/target/release
        run: |
          set -euo pipefail
          ./sigma-engine.exe --port 8756 &
          SIDECAR_PID=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8756/health > /dev/null 2>&1 && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8756/health
          echo
          curl -sf http://127.0.0.1:8756/smoke -o smoke.json
          cat smoke.json
          python3 -c "import json; d = json.load(open('smoke.json')); assert d['match'] is True, d"
          kill "$SIDECAR_PID"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sigma-ai-windows-installers
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-mac:
    name: Build Mac installer
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: engine/pyproject.toml

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@v2.9.2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install engine (+ PyInstaller)
        working-directory: engine
        run: pip install -e ".[dev]"

      - name: Build sidecar and place it for Tauri's externalBin
        run: scripts/build-sidecar.sh

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      # app only, not dmg -- the .app has to be fixed (next step) before
      # it's wrapped into a dmg, and once wrapped a dmg is a sealed disk
      # image, not something to patch after the fact.
      - name: tauri build (app bundle only)
        working-directory: desktop
        run: npm run tauri build -- --bundles app

      # The onefile sidecar has no _internal support directory to relocate --
      # the single self-extracting exe Tauri stages at Contents/MacOS/sigma-
      # engine is the whole artifact, and it unpacks itself to a temp dir at
      # launch. The smoke-test and dmg steps below still need APP_PATH, so
      # just locate the one .app bundle (same nullglob / exactly-one guard the
      # old onedir fixup step used) and export it to the job env.
      - name: Locate the .app bundle
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(desktop/src-tauri/target/release/bundle/macos/*.app)
          if [ ${#apps[@]} -ne 1 ]; then
            echo "ERROR: expected exactly one .app bundle, found: ${apps[*]}" >&2
            exit 1
          fi
          APP_PATH="${apps[0]}"
          echo "App bundle: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      # Proves the real shipping artifact works, on real macOS, before we
      # bother sealing a dmg around it -- the sidecar is a plain CLI binary,
      # so it can be smoke-tested directly without launching the GUI app.
      - name: Smoke-test the sidecar inside the .app
        run: |
          set -euo pipefail
          "$APP_PATH/Contents/MacOS/sigma-engine" --port 8756 &
          SIDECAR_PID=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8756/health > /dev/null 2>&1 && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8756/health
          echo
          curl -sf http://127.0.0.1:8756/smoke -o smoke.json
          cat smoke.json
          python3 -c "import json; d = json.load(open('smoke.json')); assert d['match'] is True, d"
          kill "$SIDECAR_PID"

      - name: Build dmg from the .app
        run: |
          set -euo pipefail
          mkdir -p dist-dmg
          hdiutil create -volname "Sigma AI" -srcfolder "$APP_PATH" -ov -format UDZO \
            "dist-dmg/Sigma AI_0.1.0_$(uname -m).dmg"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sigma-ai-mac-installer
          path: dist-dmg/*.dmg
          if-no-files-found: error
